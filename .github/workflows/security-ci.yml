name: security-ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Em evento de pull_request o gitleaks lista os commits do PR pela API do GitHub.
    # Só com `contents: read` isso dá 403 e o job falha — sem que exista segredo nenhum.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Histórico completo: um segredo commitado e depois "removido" continua no
          # histórico, e é de lá que ele vaza.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem comentar no PR: exigiria permissão de escrita, e o resultado já aparece
          # no próprio check. Menos privilégio, mesma informação.
          GITLEAKS_ENABLE_COMMENTS: "false"

  code:
    name: SAST (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version

      - name: Bandit
        # -ll: só reporta severidade média ou alta. Ruído baixo não vira gate.
        # Os testes ficam de fora: senha de teste e assert não são vulnerabilidade.
        run: |
          pip install bandit
          bandit -r backend/app -ll

  deps:
    name: dependências vulneráveis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        # Falha só em vulnerabilidade alta/crítica: um "moderate" em dep de build não
        # justifica travar o merge, mas fica visível no log.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
